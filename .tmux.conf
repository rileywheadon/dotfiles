# Unbind all keys
unbind-key -a

# Change prefix to Ctrl+a 
set -g prefix C-a
bind C-a send-prefix

# Start pane/session indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Allow for longer names in the status bar
set -g status-left-length 20

# Simplify the status bar
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"

# Style the bottom bar (transparent background, cyan text)
set -g status-style bg=default,fg=#96cc83

# Reduce escape time to speed up switch between insert/normal mode in nvim
set -sg escape-time 10  

# List sessions with s, rename sessions with $ (default)
bind s choose-tree -s
bind $ command-prompt -I "#S" "rename-session '%%'"

# Create a new window with w, rename a window with , (default)
bind w new-window \; send-keys "exec bash" Enter "clear" Enter
bind , command-prompt -I "#W" "rename-window '%%'"

# Use vi mode for copy/pasting from windows 
setw -g mode-keys vi
bind c copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Change windows with number keys:
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8

# Intuitive splits
bind H split-window -h \; send-keys "exec bash" Enter "clear" Enter
bind V split-window -v \; send-keys "exec bash" Enter "clear" Enter

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"
